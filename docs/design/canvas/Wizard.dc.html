<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #f4f6f8; font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; overflow: hidden; }
    x-dc { display: block; height: 100%; }
    a { color: #0e6f87; } a:hover { color: #0a5568; }
    .num { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #f4f6f8; color: #101720; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0">
    <span style="font-size: 15px; font-weight: 400; color: #55637a">Cancel</span>
    <div style="display: flex; gap: 6px">
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #0e6f87"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #0e6f87"></div>
      <div style="width: 26px; height: 4px; border-radius: 999px; background: #ccd4dd"></div>
    </div>
    <span style="font-size: 15px; font-weight: 400; color: #0e6f87">Back</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px; padding: 26px 20px 12px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 class="num" style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #101720">Who is playing?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #55637a">First names. Type one, hit add, type the next.</p>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; height: 52px; display: flex; align-items: center; padding: 0 16px; border-radius: 15px; background: #ffffff; border: 1.5px solid #0e6f87; font-size: 16px; color: #55637a">Name</div>
      <div style="width: 84px; display: flex; align-items: center; justify-content: center; border-radius: 15px; background: #0e6f87; color: #ffffff; font-size: 16px; font-weight: 700">Add</div>
    </div>

    <span class="num" style="font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #55637a">4 players</span>

    <div style="display: flex; flex-direction: column; border-radius: 20px; background: #ffffff; border: 1px solid #ccd4dd; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 18px; border-bottom: 1px solid #ccd4dd">
        <span style="flex-grow: 1; font-size: 16px; color: #101720">Ana</span>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"></path></svg>
        </div>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a; font-size: 20px">&times;</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 18px; border-bottom: 1px solid #ccd4dd">
        <span style="flex-grow: 1; font-size: 16px; color: #101720">Ben</span>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"></path></svg>
        </div>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a; font-size: 20px">&times;</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 18px; border-bottom: 1px solid #ccd4dd">
        <span style="flex-grow: 1; font-size: 16px; color: #101720">Cara</span>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"></path></svg>
        </div>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a; font-size: 20px">&times;</div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; padding: 5px 8px 5px 18px">
        <span style="flex-grow: 1; font-size: 16px; color: #101720">Dan</span>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"></path></svg>
        </div>
        <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #55637a; font-size: 20px">&times;</div>
      </div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 15px; background: #0e6f87; color: #ffffff; font-size: 16px; font-weight: 700; margin-bottom: 22px">Next</div>

  </div>

</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0d1117; font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; overflow: hidden; }
    x-dc { display: block; height: 100%; }
    a { color: #3fa8c4; } a:hover { color: #63c1d8; }
    .num { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: #0d1117; color: #e6ebf2; overflow: hidden">

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column">

    <div style="display: flex; flex-direction: column; gap: 18px; padding: 26px 20px 24px; border-radius: 0 0 30px 30px; background: linear-gradient(135deg, #080b0f 0%, #151b23 100%); color: #e6ebf2">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #e6ebf21f; font-size: 19px; color: #e6ebf2">←</div>
        <h1 class="num" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #e6ebf2">Round 3 of 7</h1>
        <div style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #e6ebf21f; font-size: 19px; color: #e6ebf2">→</div>
      </div>
      <div style="display: flex; gap: 5px" aria-hidden="true">
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #3fa8c4"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #3fa8c4"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #3fa8c4"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #28313d"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #28313d"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #28313d"></div>
        <div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #28313d"></div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 0; overflow: hidden">

      <div style="display: flex; flex-direction: column; gap: 14px">

        <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 24px; background: #151b23; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45)">
          <span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Far end</span>
          <div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 14px; background: #3fa8c41f">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Ana &amp; Ben</span>
            <span class="num" style="font-size: 22px; line-height: 1.2; font-weight: 700; color: #3fa8c4">24</span>
          </div>
          <span style="padding: 0 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <div style="display: flex; align-items: center; gap: 12px; padding: 9px 12px">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Cara &amp; Dan</span>
            <span class="num" style="font-size: 22px; line-height: 1.2; font-weight: 500; color: #93a1b5">18</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 24px; background: #151b23; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45)">
          <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
            <span style="flex-grow: 1; min-width: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Court 2</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: #080b0f; font-size: 11px; color: #93a1b5; white-space: nowrap">No score yet</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 7px 12px">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Eva &amp; Finn<span style="color: #93a1b5">*</span></span>
          </div>
          <span style="padding: 0 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <div style="display: flex; align-items: center; gap: 12px; padding: 7px 12px">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Gita &amp; Hugo</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 24px; background: #151b23; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45)">
          <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
            <span style="flex-grow: 1; min-width: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Court 3</span>
            <span style="padding: 4px 10px; border-radius: 999px; background: #080b0f; font-size: 11px; color: #93a1b5; white-space: nowrap">No score yet</span>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 7px 12px">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Iris &amp; Jonas</span>
          </div>
          <span style="padding: 0 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <div style="display: flex; align-items: center; gap: 12px; padding: 7px 12px">
            <span style="flex-grow: 1; min-width: 0; font-size: 17px; line-height: 1.25; color: #e6ebf2">Kira &amp; Luka</span>
          </div>
        </div>

      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #93a1b5">* Same-gender pair: the roster left nobody of the other gender to partner.</p>
        <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #93a1b5">Sitting out: Mara, Nils</p>
      </div>

      <div style="flex-grow: 1"></div>

      

      <div style="height: 106px; flex-shrink: 0"></div>

    </div>

  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 4px; padding: 7px; border-radius: 999px; background: #151b23; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55)">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; background: #3fa8c4; color: #04161c">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16M3 12h18"></path></svg>
      <span style="font-size: 13px; font-weight: 700">Round</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; color: #93a1b5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      <span style="font-size: 13px; font-weight: 400">Standings</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; color: #93a1b5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 19a6 6 0 0 1 12 0"></path><path d="M16 6.5a3 3 0 0 1 0 5.8M18 19a5.5 5.5 0 0 0-2-4.2"></path></svg>
      <span style="font-size: 13px; font-weight: 400">Players</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #0d1117; font-family: Verdana, Geneva, 'DejaVu Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    html, body { height: 100%; overflow: hidden; }
    x-dc { display: block; height: 100%; }
    a { color: #3fa8c4; } a:hover { color: #63c1d8; }
    .num { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0d1117; color: #e6ebf2; overflow: hidden">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 16px 12px; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="width: 46px; height: 46px; border: 1px solid #28313d; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #93a1b5; font-size: 19px; background: #151b23">&larr;</div>
      <h1 class="num" style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.015em; color: #e6ebf2">Round 3 of 7</h1>
      <div style="width: 46px; height: 46px; border: 1px solid #28313d; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #93a1b5; font-size: 19px; background: #151b23">&rarr;</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">

      <div style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 18px; background: #151b23; border: 1.5px solid #3fa8c4">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Far end</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Ana &amp; Ben</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Cara &amp; Dan</span>
        </div>
        <span class="num" style="font-size: 30px; font-weight: 700; color: #3fa8c4; white-space: nowrap">24 &ndash; 18</span>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 18px; background: #151b23; border: 1px solid #28313d">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Court 2</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Eva &amp; Finn<span style="color: #93a1b5">*</span></span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Gita &amp; Hugo</span>
        </div>
        <span style="font-size: 13px; color: #93a1b5; white-space: nowrap">No score yet</span>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 18px; background: #151b23; border: 1px solid #28313d">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">Court 3</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Iris &amp; Jonas</span>
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #93a1b5">v</span>
          <span style="font-size: 17px; line-height: 1.25; color: #e6ebf2">Kira &amp; Luka</span>
        </div>
        <span style="font-size: 13px; color: #93a1b5; white-space: nowrap">No score yet</span>
      </div>

    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #93a1b5">* Same-gender pair: the roster left nobody of the other gender to partner.</p>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #93a1b5">Sitting out: Mara, Nils</p>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 15px; background: #3fa8c4; color: #04161c; font-size: 16px; font-weight: 700">Round 4 &rarr;</div>

  </div>

  <div style="display: flex; border-top: 1px solid #28313d; background: #151b23; padding-bottom: 22px">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 0 9px; color: #3fa8c4">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16M3 12h18"></path></svg>
      <span style="font-size: 12px; font-weight: 700">Round</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 0 9px; color: #93a1b5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      <span style="font-size: 12px; font-weight: 400">Standings</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 11px 0 9px; color: #93a1b5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><path d="M3 19a6 6 0 0 1 12 0"></path><path d="M16 6.5a3 3 0 0 1 0 5.8M18 19a5.5 5.5 0 0 0-2-4.2"></path></svg>
      <span style="font-size: 12px; font-weight: 400">Players</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

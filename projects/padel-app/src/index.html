<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Padel Tournament Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The bar behind the notch matches the app surface, not the brand, so `viewport-fit=cover`
         reads as one continuous screen rather than a coloured band above the app. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and reads this. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!--
      The organizer's theme, applied before the first frame (ADR-0031 §5).

      This is the only JavaScript in the app outside Angular, and it exists because everything
      Angular does happens *after* the first paint: an organizer who chose the opposite of their OS
      would otherwise see a flash of the wrong theme on every cold start, and a toggle that flashes
      is worse than no toggle. Nothing here is run by a test, read by a linter or proved by the
      convention check, so it stays the size it is.

      It owns three things, and it has to own all three or an override is only half applied.
      `data-theme` is what the app draws itself with, and it is stamped with a *resolved* theme —
      `system` included — so there is one value to read for what is currently on screen.
      `color-scheme` is what the browser draws its own scrollbars and form controls with.
      `theme-color` is the bar behind the notch, and above it there are two of them selected by
      `prefers-color-scheme`; under an override that selection is the OS's answer rather than the
      organizer's, so the wrong one is dropped and the right one loses its media and simply
      applies. `preference/preferences.ts` keeps all three in step from here on.

      No colour is written here. The bar's two values are read off the metas above, which is the
      same reason nothing in the app names one: `styles.css` is where colour lives.
    -->
    <script>
      (function () {
        try {
          var stored = null;
          try {
            stored = localStorage.getItem('pth.theme');
          } catch (blocked) {
            // Private mode, or site data blocked. The app opens in the system theme.
          }

          var chosen = stored === 'light' || stored === 'dark' ? stored : 'system';
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = chosen === 'system' ? (prefersDark ? 'dark' : 'light') : chosen;

          document.documentElement.dataset.theme = resolved;

          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) {
            scheme.content = chosen === 'system' ? 'light dark' : resolved;
          }

          var bars = document.querySelectorAll('meta[name="theme-color"]');
          var wanted = document.querySelector(
            'meta[name="theme-color"][media="(prefers-color-scheme: ' + resolved + ')"]',
          );
          if (wanted) {
            for (var i = 0; i < bars.length; i++) {
              if (bars[i] !== wanted) {
                bars[i].remove();
              }
            }
            wanted.removeAttribute('media');
          }
        } catch (unsupported) {
          // Whatever this browser could not do, it opens in the system theme and works.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

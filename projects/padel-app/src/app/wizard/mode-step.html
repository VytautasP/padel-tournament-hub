<section class="space-y-5">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold tracking-tight text-ink">{{ copy.wizard.mode.heading }}</h1>
    <p class="text-sm text-ink-muted">{{ copy.wizard.mode.lead }}</p>
  </header>

  <ul class="space-y-3">
    @for (choice of choices; track choice) {
      <li>
        <button
          type="button"
          class="w-full rounded-2xl border border-line bg-surface-raised p-4 text-left"
          [attr.aria-label]="copy.wizard.mode.name(choice)"
          (click)="choose(choice)"
        >
          <span class="block text-lg font-semibold text-ink">
            {{ copy.wizard.mode.name(choice) }}
          </span>
          <span class="mt-1 block text-sm text-ink-muted">
            {{ copy.wizard.mode.blurb(choice) }}
          </span>
        </button>
      </li>
    }
  </ul>
</section>

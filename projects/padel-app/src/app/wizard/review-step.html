<section class="space-y-5">
  <header class="space-y-1">
    <h1 class="text-title font-bold text-ink">{{ copy.wizard.review.heading }}</h1>
    <p class="text-meta text-ink-muted">{{ copy.wizard.review.lead }}</p>
  </header>

  <dl class="grid grid-cols-2 gap-3 rounded-2xl border border-line bg-surface-raised p-4">
    <dt class="text-meta text-ink-muted">{{ copy.wizard.review.mode }}</dt>
    <dd class="text-right text-meta font-bold text-ink">{{ modeNames[draft().mode()] }}</dd>
    <dt class="text-meta text-ink-muted">{{ copy.wizard.review.players }}</dt>
    <dd class="text-right text-meta font-bold text-ink">{{ draft().players().length }}</dd>
  </dl>

  <div class="space-y-3">
    <app-number-field
      [label]="copy.wizard.review.targetScore"
      [value]="draft().targetScore()"
      (changed)="draft().setTargetScore($event)"
    />
    <app-number-field
      [label]="copy.wizard.review.courtCount"
      [value]="draft().courtCount()"
      (changed)="draft().setCourtCount($event)"
    />
    <app-number-field
      [label]="copy.wizard.review.roundCount"
      [value]="draft().roundCount()"
      (changed)="draft().setRoundCount($event)"
    />
  </div>

  <div class="space-y-3">
    <h2 class="text-micro font-bold text-ink-muted uppercase">
      {{ copy.wizard.review.courtNames }}
    </h2>
    @for (court of courts(); track court.number) {
      <app-text-field
        [label]="court.label"
        [value]="court.name"
        (changed)="draft().setCourtName(court.number, $event)"
      />
    }
  </div>

  <button
    type="button"
    class="w-full rounded-xl bg-brand px-4 py-3 text-control font-bold text-brand-ink"
    (click)="create.emit()"
  >
    {{ copy.wizard.review.create }}
  </button>
</section>

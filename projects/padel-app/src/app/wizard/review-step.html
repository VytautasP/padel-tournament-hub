<!--
  The last screen: what was decided, the three numbers that were not, and the courts' names. The
  button that commits it belongs to the wizard's chrome rather than to this section, so that the
  way on is in the same place it has been since the first step.
-->
<section class="flex flex-col gap-[22px]">
  <header class="flex flex-col gap-[6px]">
    <h1 class="text-title font-bold text-ink">{{ copy.wizard.review.heading }}</h1>
    <p class="text-lead text-pretty text-ink-muted">{{ copy.wizard.review.lead }}</p>
  </header>

  <!-- What the earlier steps settled, read back rather than offered again: changing either of
       these is stepping back to the screen that asked. -->
  <dl
    class="grid grid-cols-2 gap-[10px] rounded-[20px] border border-line bg-surface-raised px-[18px] py-4"
  >
    <dt class="text-meta text-ink-muted">{{ copy.wizard.review.mode }}</dt>
    <dd class="text-meta text-right font-bold text-ink">{{ modeNames[draft().mode()] }}</dd>
    <dt class="text-meta text-ink-muted">{{ copy.wizard.review.players }}</dt>
    <dd class="text-meta text-right font-bold text-ink">{{ draft().players().length }}</dd>
  </dl>

  <div class="flex flex-col gap-3">
    <app-number-field
      [label]="copy.wizard.review.targetScore"
      [value]="draft().targetScore()"
      (changed)="draft().setTargetScore($event)"
    />
    <app-number-field
      [label]="copy.wizard.review.courtCount"
      [value]="draft().courtCount()"
      (changed)="draft().setCourtCount($event)"
    />
    <app-number-field
      [label]="copy.wizard.review.roundCount"
      [value]="draft().roundCount()"
      (changed)="draft().setRoundCount($event)"
    />
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-micro font-bold text-ink-muted uppercase">
      {{ copy.wizard.review.courtNames }}
    </h2>
    @for (court of courts(); track court.number) {
      <app-text-field
        [label]="court.label"
        [value]="court.name"
        (changed)="draft().setCourtName(court.number, $event)"
      />
    }
  </div>
</section>

<div class="flex items-center justify-between gap-4">
  <label class="text-row text-ink" [attr.for]="fieldId">{{ label() }}</label>
  <input
    type="text"
    autocomplete="off"
    class="w-40 rounded-xl border border-line bg-surface-raised px-3 py-2 text-right text-control text-ink"
    [id]="fieldId"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>

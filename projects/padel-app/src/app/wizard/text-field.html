<div class="flex items-center justify-between gap-4">
  <label class="text-row text-ink" [attr.for]="fieldId">{{ label() }}</label>
  <input
    type="text"
    autocomplete="off"
    class="text-control h-11 w-40 rounded-control bg-surface-sunken px-4 text-right text-ink focus:outline-2 focus:outline-brand"
    [id]="fieldId"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>

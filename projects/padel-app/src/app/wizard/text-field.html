<div class="flex items-center justify-between gap-4">
  <label class="text-row text-ink" [attr.for]="fieldId">{{ label() }}</label>
  <input
    type="text"
    autocomplete="off"
    class="text-control h-11 w-40 rounded-[15px] border border-line bg-surface-raised px-4 text-right text-ink focus:border-brand focus:outline-none"
    [id]="fieldId"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>

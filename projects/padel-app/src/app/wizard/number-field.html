<div class="flex items-center justify-between gap-4">
  <label class="text-row text-ink" [attr.for]="fieldId">{{ label() }}</label>
  <input
    type="number"
    inputmode="numeric"
    step="1"
    [min]="minimum"
    class="text-control h-11 w-24 rounded-control bg-surface-sunken px-4 text-right text-ink focus:outline-2 focus:outline-brand"
    [id]="fieldId"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>

<div class="flex items-center justify-between gap-4">
  <label class="text-base text-ink" [attr.for]="fieldId">{{ label() }}</label>
  <input
    type="number"
    inputmode="numeric"
    step="1"
    [min]="minimum"
    class="w-24 rounded-xl border border-line bg-surface-raised px-3 py-2 text-right text-base text-ink"
    [id]="fieldId"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>

<main class="mx-auto flex min-h-screen max-w-md flex-col gap-6 px-6 py-8">
  <div class="flex-1">
    @switch (current()) {
      @case ('mode') {
        <app-mode-step [draft]="draft" (chosen)="next()" />
      }
      @case ('players') {
        <app-players-step [draft]="draft" />
      }
      @case ('pairing') {
        <app-pairing-step [draft]="draft" />
      }
      @case ('review') {
        <app-review-step [draft]="draft" (create)="create()" />
      }
    }
  </div>

  <nav class="flex gap-3">
    <button
      type="button"
      class="flex-1 rounded-xl border border-line px-4 py-3 text-control font-bold text-ink"
      (click)="back()"
    >
      {{ current() === 'mode' ? copy.wizard.cancel : copy.wizard.back }}
    </button>
    @if (hasNext() && current() !== 'mode') {
      <button
        type="button"
        class="flex-1 rounded-xl bg-brand px-4 py-3 text-control font-bold text-brand-ink disabled:opacity-40"
        [disabled]="!canAdvance()"
        (click)="next()"
      >
        {{ copy.wizard.next }}
      </button>
    }
  </nav>
</main>

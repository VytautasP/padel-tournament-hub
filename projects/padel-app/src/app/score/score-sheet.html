<!--
  The sheet's own chrome — where it sits, how its corners are cut, which way its shadow falls — is
  not here. `Sheets` decides that and `styles.css` draws it, because it is the same answer for
  every focused surface in the app and a different answer at the desk (ADR-0022 §4). What is here
  is one court and the two numbers it can hold.
-->
<section class="flex flex-col gap-[22px] px-5 pt-[22px] pb-[34px]">
  <!--
    The court sits in a sunken well rather than a bordered box (ADR-0035 §2, move 1, one level in).
    The sheet is already the raised plane here, so a card resting on a shadow on top of it would be
    a second lift for no reason; what this block has to do is set the court apart from the two
    buttons under it, and the page's own ground does that.
  -->
  <div class="flex flex-col gap-2 rounded-card bg-surface p-3.5">
    <h2 class="text-micro px-1 font-bold text-ink-muted uppercase">
      {{ data.court.name }}
    </h2>

    @for (entry of sides; track entry.side) {
      @if (!$first) {
        <span class="text-micro px-3 font-bold text-ink-muted uppercase">
          {{ copy.round.versus }}
        </span>
      }

      <!--
        The side the number is typed into sits on the tinted fill, which is the same mark a scored
        court carries on the board behind this sheet (move 5). Either side takes it, because a
        score is one number typed into either side and the engine derives the other (ADR-0014).
      -->
      <div
        class="flex items-center gap-[14px] rounded-control px-3 py-2"
        [class]="holdsTheNumber(entry.side) ? 'bg-brand-wash' : ''"
      >
        <label class="text-name min-w-0 flex-1 truncate text-ink" [attr.for]="fieldId(entry.side)">
          {{ copy.round.side(entry.names) }}
        </label>
        <div class="flex items-baseline gap-2">
          <!--
            A filled control rather than a bordered box. It is the primary act of this screen, and
            what makes it look like one is that it is a solid surface the thumb aims at — the ring
            is reserved for the side actually holding the number, so it says which of the two was
            typed rather than merely outlining both.
          -->
          <input
            type="text"
            inputmode="numeric"
            autocomplete="off"
            class="text-score-field h-[60px] w-[92px] rounded-control bg-surface-raised px-[14px] text-right font-bold text-ink"
            [class]="holdsTheNumber(entry.side) ? 'border-[1.5px] border-brand' : ''"
            [id]="fieldId(entry.side)"
            [value]="valueFor(entry.side)"
            (input)="onInput(entry.side, $event)"
          />
          <span class="text-meta text-ink-muted">{{ copy.score.outOf(data.targetScore) }}</span>
        </div>
      </div>
    }
  </div>

  <!--
    A correction, not an alarm. Nothing has gone wrong with the evening — a number was typed that
    the match cannot hold — so it is the warning token rather than the danger one, and it is set at
    the weight of the sentences everywhere else rather than shouted in bold.
  -->
  @if (tooHigh()) {
    <p class="text-meta text-warning">{{ copy.score.tooHigh(data.targetScore) }}</p>
  }

  <!--
    Save is the button this sheet exists for and it is weighted accordingly: a gradient pill
    carrying the brand shadow, on the side a right thumb reaches without moving the phone. Cancel
    is the same size — it has to stay easy to hit by intention — and takes the sunken fill, which
    is a control without being an invitation.
  -->
  <div class="flex gap-3">
    <button
      type="button"
      class="text-control h-[54px] flex-1 rounded-full bg-surface-sunken text-ink"
      (click)="cancel()"
    >
      {{ copy.score.cancel }}
    </button>
    <button
      type="button"
      class="text-control h-[54px] flex-1 rounded-full bg-linear-135 from-brand-strong to-brand font-bold text-brand-ink shadow-brand disabled:opacity-40 disabled:shadow-none"
      [disabled]="!canSave()"
      (click)="save()"
    >
      {{ copy.score.save }}
    </button>
  </div>
</section>

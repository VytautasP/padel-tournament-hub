<!--
  Where this sits and what it is shaped like is `Sheets`' answer and `styles.css`' drawing — under
  the thumb that asked the question on a phone, in the middle of the screen at a desk (ADR-0022
  §4). What is here is the question, and the two ways out of it.
-->
<section class="flex flex-col gap-[18px] px-5 pt-[18px] pb-[34px]">
  <header class="flex flex-col gap-1.5">
    <h2 class="text-header font-bold text-ink">{{ data.heading }}</h2>
    <p class="text-lead text-ink-muted">{{ data.lead }}</p>
  </header>

  <div class="flex gap-3">
    <button
      type="button"
      class="text-control h-[54px] flex-1 rounded-[15px] border border-line px-4 text-ink"
      (click)="cancel()"
    >
      {{ copy.confirm.cancel }}
    </button>
    <!--
      Where `danger` appears at all, and only on the tap that spends it (ADR-0021 §3) — never on
      a question that has not said it destroys anything. The way out beside it stays neutral: a
      sheet where both buttons shout is a sheet where neither says anything.

      `brand-ink` on a danger ground is the ink a filled button takes rather than the brand's own —
      white over the light theme's red and near-black over the dark theme's, which is the contrast
      each of them needs. A `danger-ink` token would be a second name for a value that has never
      differed.
    -->
    <button
      type="button"
      class="text-control h-[54px] flex-1 rounded-[15px] px-4 font-bold text-brand-ink"
      [class]="data.unrecoverable ? 'bg-danger' : 'bg-brand'"
      (click)="confirm()"
    >
      {{ data.action }}
    </button>
  </div>
</section>

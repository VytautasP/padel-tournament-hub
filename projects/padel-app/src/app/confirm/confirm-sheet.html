<section class="space-y-4 p-5">
  <h2 class="text-name font-bold text-ink">{{ data.heading }}</h2>
  <p class="text-meta text-ink-muted">{{ data.lead }}</p>

  <div class="flex gap-3">
    <button
      type="button"
      class="flex-1 rounded-xl border border-line px-4 py-3 text-control font-bold text-ink"
      (click)="cancel()"
    >
      {{ copy.confirm.cancel }}
    </button>
    <!--
      The one place `danger` is allowed to appear, and only on the tap that spends it (ADR-0021
      §3). The way out beside it stays neutral: a sheet where both buttons shout is a sheet where
      neither says anything.

      `brand-ink` on a danger ground is the ink a filled button takes rather than the brand's own —
      white over the light theme's red and near-black over the dark theme's, which is the contrast
      each of them needs. A `danger-ink` token would be a second name for a value that has never
      differed.
    -->
    <button
      type="button"
      class="flex-1 rounded-xl px-4 py-3 text-control font-bold text-brand-ink"
      [class]="data.unrecoverable ? 'bg-danger' : 'bg-brand'"
      (click)="confirm()"
    >
      {{ data.action }}
    </button>
  </div>
</section>

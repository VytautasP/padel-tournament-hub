@if (ready()) {
  @switch (current()) {
    @case ('wizard') {
      <app-create-wizard (created)="show('session')" (cancelled)="show('landing')" />
    }
    @case ('session') {
      <app-session-shell (left)="leave()" />
    }
    @default {
      <app-landing (started)="show('wizard')" (opened)="open($event)" />
    }
  }
}

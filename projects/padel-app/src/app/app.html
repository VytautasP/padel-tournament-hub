@if (ready()) {
  @switch (current()) {
    @case ('wizard') {
      <app-create-wizard (created)="show('session')" (cancelled)="show('landing')" />
    }
    @case ('session') {
      <app-round-tab />
    }
    @default {
      <app-landing (started)="show('wizard')" (resumed)="show('session')" />
    }
  }
}

<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center gap-8 px-6 py-12">
  <header class="space-y-2">
    <h1 class="text-3xl font-semibold tracking-tight text-ink">{{ copy.appName }}</h1>
    <p class="text-ink-muted">{{ copy.landing.tagline }}</p>
  </header>

  @if (session(); as active) {
    <section class="space-y-4 rounded-2xl border border-line bg-surface-raised p-5 shadow-sm">
      <div class="space-y-1">
        <h2 class="text-sm font-medium tracking-wide text-ink-muted uppercase">
          {{ copy.landing.resumeHeading }}
        </h2>
        <p class="text-lg text-ink">
          {{ copy.landing.resumeSummary(active.mode, active.roster.length, roundNumber()) }}
        </p>
      </div>
      <button
        type="button"
        class="w-full rounded-xl bg-brand px-4 py-3 text-base font-semibold text-brand-ink"
        (click)="resumed.emit()"
      >
        {{ copy.landing.resume }}
      </button>
    </section>
  } @else {
    <button
      type="button"
      class="w-full rounded-xl bg-brand px-4 py-3 text-base font-semibold text-brand-ink"
      (click)="started.emit()"
    >
      {{ copy.landing.newSession }}
    </button>
  }
</main>

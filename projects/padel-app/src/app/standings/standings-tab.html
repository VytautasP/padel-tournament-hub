<section class="flex flex-col gap-5 px-4 py-6">
  <h1 class="text-2xl font-semibold tracking-tight text-ink">{{ copy.session.standings }}</h1>

  <ul class="divide-y divide-line overflow-hidden rounded-2xl border border-line bg-surface-raised">
    @for (standing of standings(); track standing.playerId) {
      <li>
        <button
          type="button"
          class="flex w-full items-baseline gap-3 px-4 py-3 text-left"
          [attr.aria-expanded]="isExpanded(standing.playerId)"
          (click)="toggle(standing.playerId)"
        >
          <span class="w-6 text-sm tabular-nums text-ink-muted">{{ standing.position }}</span>
          <span class="min-w-0 flex-1 truncate text-base text-ink">{{ standing.name }}</span>
          <span class="text-base font-semibold tabular-nums text-ink">
            {{ copy.standings.rate(standing.pointsPerMatch, standing.matchesPlayed) }}
          </span>
        </button>

        @if (isExpanded(standing.playerId)) {
          <dl class="flex gap-6 px-4 pb-3 text-sm text-ink-muted">
            <div class="flex gap-2">
              <dt>{{ copy.standings.matchesPlayed }}</dt>
              <dd class="tabular-nums text-ink">{{ standing.matchesPlayed }}</dd>
            </div>
            <div class="flex gap-2">
              <dt>{{ copy.standings.totalPoints }}</dt>
              <dd class="tabular-nums text-ink">{{ standing.points }}</dd>
            </div>
          </dl>
        }
      </li>
    }
  </ul>
</section>

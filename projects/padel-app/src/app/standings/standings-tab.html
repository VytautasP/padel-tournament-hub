<section class="flex min-h-full flex-col gap-5 px-4 pt-7 pb-3">
  <h1 class="text-title font-bold text-ink">{{ copy.session.standings }}</h1>

  <app-standings-table [standings]="standings()" />

  <!--
    The ending sits at the bottom of the screen rather than under the last row, for the reason the
    advance card does on the Round tab: a table longer than the screen scrolls, and the button
    arrives at the end of the scroll instead of floating over it.
  -->
  <div class="flex-1"></div>

  @if (!ended()) {
    <!--
      Weighted as the ordinary end of an evening, not as a hazard. It is how every session is
      supposed to finish and it is what produces the podium above; `danger` here would teach the
      organizer to fear the happy path (ADR-0021 §3). The gradient pill is the treatment every
      primary action in the app now wears (ADR-0035 §2, move 4), which is the same statement made
      louder — this is the thing to tap, and it is the good ending.
    -->
    <button
      type="button"
      class="text-control h-[54px] rounded-full bg-linear-135 from-brand-strong to-brand px-4 font-bold text-brand-ink shadow-brand"
      (click)="end()"
    >
      {{ copy.standings.end }}
    </button>
  }
</section>

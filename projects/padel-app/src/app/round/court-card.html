<span class="flex min-w-0 flex-1 flex-col gap-1">
  <span class="text-micro font-bold text-ink-muted uppercase">
    {{ court().name }}
  </span>
  <span class="text-name text-ink">
    <app-side [side]="court().sideA" />
  </span>
  <span class="text-micro font-bold text-ink-muted uppercase">
    {{ copy.round.versus }}
  </span>
  <span class="text-name text-ink">
    <app-side [side]="court().sideB" />
  </span>
</span>
<ng-content />

<!--
  The Round tab is the board, plus the two things only the organizer of this evening can do with
  it: tap a court to score it, and ask for one more round (ADR-0026 §2).

  There is no board before there is a session. The shell renders this tab inside a session, so the
  empty branch is the impossible one and renders nothing rather than a screen apologising for a
  state the app cannot be in.
-->
@if (session(); as session) {
  <app-round-board
    [session]="session"
    [courtNames]="courtNames()"
    [organizing]="true"
    (scored)="score($event)"
    (roundWanted)="addRound()"
  />
}

@if (round(); as view) {
  <section class="flex flex-col gap-5 px-4 py-6">
    <h1 class="text-2xl font-semibold tracking-tight text-ink">
      {{ copy.round.heading(view.number, roundCount()) }}
    </h1>

    <ul class="space-y-3">
      @for (court of view.courts; track court.courtNumber) {
        <li>
          <button
            type="button"
            class="w-full space-y-2 rounded-2xl border p-4 text-left"
            [class]="
              court.score ? 'border-brand bg-surface-sunken' : 'border-line bg-surface-raised'
            "
            [attr.aria-label]="copy.round.enterScore(court.courtNumber)"
            (click)="score(court)"
          >
            <span class="block text-xs font-medium tracking-wide text-ink-muted uppercase">
              {{ copy.round.courtName(court.courtNumber) }}
            </span>
            <span class="block text-lg text-ink">{{ copy.round.side(court.sideA) }}</span>
            <span class="block text-xs tracking-wide text-ink-muted uppercase">
              {{ copy.round.versus }}
            </span>
            <span class="block text-lg text-ink">{{ copy.round.side(court.sideB) }}</span>
            @if (court.score; as score) {
              <span class="block text-base font-semibold text-brand">
                {{ copy.round.score(score.sideA, score.sideB) }}
              </span>
            } @else {
              <span class="block text-sm text-ink-muted">{{ copy.round.noScore }}</span>
            }
          </button>
        </li>
      }
    </ul>

    @if (view.bench.length > 0) {
      <p class="text-sm text-ink-muted">{{ copy.round.bench(view.bench) }}</p>
    }
  </section>
}

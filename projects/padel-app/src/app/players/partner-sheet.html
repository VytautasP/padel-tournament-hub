<section class="space-y-4 rounded-t-3xl border border-line bg-surface-raised p-5 shadow-sheet">
  <header class="space-y-1">
    <h2 class="text-name font-bold text-ink">
      {{ copy.players.partner.heading }}
    </h2>
    <p class="text-meta text-ink-muted">{{ copy.players.partner.lead }}</p>
  </header>

  <form class="flex gap-2" (submit)="$event.preventDefault(); commit()">
    <input
      type="text"
      autocomplete="off"
      class="min-w-0 flex-1 rounded-xl border border-line bg-surface-sunken px-4 py-3 text-control text-ink"
      [placeholder]="copy.players.placeholder"
      [value]="typed()"
      (input)="onType($event)"
    />
    <button
      type="submit"
      class="rounded-xl bg-brand px-4 py-3 text-control font-bold text-brand-ink"
    >
      {{ copy.players.add }}
    </button>
  </form>

  <button
    type="button"
    class="w-full rounded-xl border border-line px-4 py-3 text-control font-bold text-ink"
    (click)="dismiss()"
  >
    {{ copy.players.partner.dismiss }}
  </button>
</section>

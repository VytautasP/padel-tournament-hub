<!--
  The rail, lifted rather than ruled off (ADR-0035 §2, move 1, applied to the plane the desk tier
  navigates from). Its width is ADR-0022 §1's 248px and stays there: `ModernDesktop` draws 232 and
  did no reasoning about it, which makes the board's number drawing slack rather than a proposal
  (ADR-0035 §6).
-->
<nav class="flex w-[248px] shrink-0 flex-col gap-[26px] bg-surface-raised px-5 py-7 shadow-float">
  <div class="flex flex-col gap-1 px-2">
    <!--
      The drawn size, taken as the role that is that size — which is `text-name`, and so
      Verdana rather than the board's Space Grotesk. The whole role or none of it: the face is
      bound to the four display roles in `styles.css` and not in templates, because a role is
      face, size, tracking and figures together, and `text-name font-display` would be three
      quarters of a decision that then has nothing to drift against.

      The cost is that the name sets over two lines. 248px of rail leaves 208px of line, and
      `Padel Tournament Hub` measures 219px in Verdana at 17 and 227px in Space Grotesk at 21
      — every role the scale has wraps here, so one line was never on offer without inventing
      a fifth display role at 17px, and a step per drawing is not a scale. Two lines of the
      name is a taller rail header than the board draws and nothing else.
    -->
    <span class="text-name font-bold text-ink">{{ copy.appName }}</span>
    <p class="text-meta text-ink-muted">{{ summary() }}</p>
  </div>

  <div class="flex flex-col gap-1">
    @for (destination of destinations(); track destination.id) {
      <button
        type="button"
        class="text-lead flex h-[46px] items-center gap-3 rounded-full px-[14px] text-left"
        [class]="
          current() === destination.id ? 'bg-brand font-bold text-brand-ink' : 'text-ink-muted'
        "
        [attr.aria-current]="current() === destination.id ? 'page' : null"
        (click)="chose.emit(destination.id)"
      >
        <app-destination-icon [panel]="destination.id" />
        {{ destination.label }}
      </button>
    }
  </div>
</nav>

<!--
  Two arrangements of the same three panels, and only one of them is in the DOM at a time.

  The rail and the bottom bar are `@if`ed rather than shown and hidden with a responsive utility,
  because the DOM test seam reads labels and cannot read CSS (ADR-0022 §5). Everything else about
  the width is a utility and stays one: the courts going two-up, and the column the main area is
  held to at every tier. `xl:` is 1280px, which is the tier's own line.
-->
<div class="flex h-screen flex-col xl:flex-row">
  @if (atDesk()) {
    <app-session-rail
      [destinations]="destinations()"
      [current]="current()"
      [summary]="summary()"
      (chose)="show($event)"
    />
  }

  <!--
    The cap is the same at every tier, and the shell is one of the two screens that keeps it: the
    landing page is the only thing that takes it back off at the desk (`styles.css`). Between a
    248px rail and a 340px aside there is nothing left to cap until the window is very wide, and
    on the window that is, a court card 2800px across is not what the extra room is for.
  -->
  <div class="page-column flex min-w-0 flex-1 flex-col">
    <!--
      The one piece of chrome a session has (ADR-0026 §4, amending ADR-0016).

      Sharing is on the left of it at every width and in every state, including after the evening
      has ended: a finished session is a record, and its final table is exactly the thing somebody
      asks to be sent. Leaving is on the right and only when there is somewhere to go — a session
      in progress is left by ending it or discarding it, both of which are elsewhere.
    -->
    <header
      class="flex items-center justify-between border-b border-line bg-surface-raised px-4 py-2"
    >
      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-full text-brand"
        [attr.aria-label]="copy.share.open"
        (click)="share()"
      >
        <!--
          Three nodes and the two lines between them: the glyph every platform draws for handing
          something to somebody else. Decoration rather than a label, so it is out of the
          accessibility tree and the button's name is the sentence bound above it.
        -->
        <svg
          class="block"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="18" cy="5" r="3" />
          <circle cx="6" cy="12" r="3" />
          <circle cx="18" cy="19" r="3" />
          <path d="M8.6 10.5 15.4 6.5M8.6 13.5l6.8 4" />
        </svg>
      </button>

      @if (ended()) {
        <button type="button" class="text-lead font-bold text-brand" (click)="left.emit()">
          {{ copy.session.done }}
        </button>
      }
    </header>

    <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'round'">
      <app-round-tab />
    </div>
    <!--
      Standings are a panel here and an aside there — never both, or the table's own End session
      would be on screen twice under one label.
    -->
    @if (!atDesk()) {
      <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'standings'">
        <app-standings-tab />
      </div>
    }
    <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'players'">
      <app-players-tab />
    </div>
  </div>

  @if (atDesk()) {
    <!--
      The same table the tab renders, in a column that never leaves. It is not bound to the round:
      whether to let somebody go home is a question about how the evening is going, and Standings
      is no longer somewhere the organizer can go and ask (ADR-0022 §3).

      The border is what keeps this plane off the page in dark, where `surface-raised` and
      `surface` are a few points apart (ADR-0022, consequences).
    -->
    <aside class="w-[340px] shrink-0 overflow-y-auto border-l border-line bg-surface-raised">
      <app-standings-tab />
    </aside>
  }

  @if (!atDesk()) {
    <app-tab-bar [destinations]="destinations()" [current]="current()" (chose)="show($event)" />
  }
</div>

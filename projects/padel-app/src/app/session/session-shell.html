<div class="page-column flex h-screen flex-col">
  @if (ended()) {
    <header class="flex justify-end border-b border-line bg-surface-raised px-4 py-2">
      <button type="button" class="text-lead font-bold text-brand" (click)="left.emit()">
        {{ copy.session.done }}
      </button>
    </header>
  }

  <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'round'">
    <app-round-tab />
  </div>
  <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'standings'">
    <app-standings-tab />
  </div>
  <div class="flex-1 overflow-y-auto" [hidden]="current() !== 'players'">
    <app-players-tab />
  </div>

  <nav class="flex border-t border-line bg-surface-raised">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        class="text-meta flex-1 py-3"
        [class]="current() === tab.id ? 'font-bold text-brand' : 'text-ink-muted'"
        [attr.aria-current]="current() === tab.id ? 'page' : null"
        (click)="show(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>
</div>
